<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Pages</title>
    <meta name="description" content="Direct links to Aleksandr Kosenko's CV pages." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2f6fed;
        --text: #1b1f2a;
        --muted: #53627a;
        --line: #e7edf7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 100%);
        font-family: "Inter", sans-serif;
        color: var(--text);
      }
      .card {
        width: min(620px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 18px 46px rgba(11, 25, 58, 0.12);
        padding: 32px 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 2.5rem);
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.6;
      }
      .links {
        display: grid;
        gap: 12px;
      }
      a {
        display: inline-block;
        text-decoration: none;
        color: var(--primary);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>CV pages</h1>
      <p>Use the direct URLs below to access the resume versions.</p>
      <div class="links">
        <a href="/python">Python CV</a>
        <a href="/1c">1C CV</a>
      </div>
    </main>
  </body>
</html>
